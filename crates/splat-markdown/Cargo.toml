[package]
name = "splat-markdown"
version = "0.0.0"
description = "The Markdown model of Splat, its commands and exports"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
caseless = "0.2"
comrak = { version = "0.59", default-features = false, features = ["shortcodes", "attributes"] }
entities = "1"
splat-i18n = { path = "../splat-i18n" }
unicode-width = "0.2"

[dev-dependencies]
roxmltree = "0.21"

[features]
selftest = []
