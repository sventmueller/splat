[package]
name = "splat-testkit"
version = "0.0.0"
description = "Random inputs and fuzz checks for the tests of Splat"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The sources of the workspace as syntax trees, for the tests that read them; the fuzz targets go without.
sources = ["dep:proc-macro2", "dep:syn"]

[dependencies]
proc-macro2 = { workspace = true, features = ["span-locations"], optional = true }
roxmltree.workspace = true
splat-file-state.workspace = true
splat-git.workspace = true
splat-import.workspace = true
splat-markdown = { workspace = true, features = ["selftest"] }
splat-notes.workspace = true
splat-ooxml.workspace = true
splat-preview.workspace = true
syn = { workspace = true, features = ["full", "parsing", "printing", "visit", "visit-mut"], optional = true }
unicode-normalization.workspace = true

[dev-dependencies]
miniz_oxide = { workspace = true, default-features = false, features = ["with-alloc"] }
splat-i18n.workspace = true
