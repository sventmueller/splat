[package]
name = "splat-testkit"
version = "0.0.0"
description = "Random inputs and fuzz checks for the tests of Splat"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
roxmltree = "0.21"
splat-file-state = { path = "../splat-file-state" }
splat-markdown = { path = "../splat-markdown", features = ["selftest"] }
splat-preview = { path = "../splat-preview" }

[dev-dependencies]
splat-i18n = { path = "../splat-i18n" }
