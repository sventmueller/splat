[workspace]
members = ["crates/*", "xtask"]
default-members = [".", "crates/*", "xtask"]
exclude = ["fuzz", "vendor/comrak"]

# Until https://github.com/kivikakk/comrak/issues/904 is fixed in a release; see vendor/comrak/PATCH.md.
[patch.crates-io]
comrak = { path = "vendor/comrak" }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
# cargo-llvm-cov builds with `--cfg coverage`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
too_many_lines = "warn"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[package]
name = "splat-app"
# The app version is in VERSION; xtask writes it into Info.plist.
version = "0.0.0"
description = "Markdown editor for macOS with a live, editable preview"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "splat"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
splat-file-state = { path = "crates/splat-file-state" }
splat-i18n = { path = "crates/splat-i18n" }
splat-markdown = { path = "crates/splat-markdown" }
splat-preview = { path = "crates/splat-preview" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3"
libc = "0.2"
objc2 = { version = "0.6.5", features = ["catch-all"] }
objc2-app-kit = { version = "0.3.2", features = ["objc2-uniform-type-identifiers"] }
objc2-foundation = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
objc2-web-kit = "0.3.2"
svg2pdf = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
splat-testkit = { path = "crates/splat-testkit" }

[features]
selftest = ["splat-markdown/selftest"]

# What ships does what the tests saw: an overflow ends in `contained` instead of a wrong offset. A keystroke costs the same;
# measured on a full layout of 10 MB, about a fifth more.
# As the release, with what a debug build checks on top.
[profile.checked]
inherits = "release"
debug-assertions = true

[profile.release]
lto = "thin"
overflow-checks = true
