[workspace]
members = ["crates/*", "xtask"]
default-members = [".", "crates/*", "xtask"]
exclude = ["fuzz", "vendor/comrak"]

# Until https://github.com/kivikakk/comrak/issues/904 is fixed in a release; see vendor/comrak/PATCH.md.
[patch.crates-io]
comrak = { path = "vendor/comrak" }

[workspace.dependencies]
splat-editor-state = { path = "crates/splat-editor-state" }
splat-file-state = { path = "crates/splat-file-state" }
splat-git = { path = "crates/splat-git" }
splat-i18n = { path = "crates/splat-i18n" }
splat-import = { path = "crates/splat-import" }
splat-markdown = { path = "crates/splat-markdown" }
splat-notes = { path = "crates/splat-notes" }
splat-ooxml = { path = "crates/splat-ooxml" }
splat-preview = { path = "crates/splat-preview" }
splat-testkit = { path = "crates/splat-testkit" }
block2 = "0.6.2"
caseless = "0.2"
comrak = { version = "0.59", default-features = false }
dispatch2 = "0.3"
emojis = "0.9"
encoding_rs = "0.8"
entities = "1"
image = { version = "0.25", default-features = false }
krilla = "0.8"
krilla-svg = "0.8"
libc = "0.2"
miniz_oxide = "0.9"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
objc2-web-kit = "0.3.2"
proc-macro2 = { version = "1", default-features = false }
roxmltree = "0.21"
syn = { version = "3", default-features = false }
unicode-normalization = "0.1"
unicode-width = "0.2"
usvg = "0.47"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
# cargo-llvm-cov builds with `--cfg coverage`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
too_many_lines = "warn"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[package]
name = "splat-app"
# The app version is in VERSION; xtask writes it into Info.plist.
version = "0.0.0"
description = "Markdown editor for macOS with a live, editable preview"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "splat"
path = "src/main.rs"

[[bin]]
name = "splat-decoder"
path = "src/decoder_main.rs"

[lints]
workspace = true

[dependencies]
splat-editor-state.workspace = true
splat-file-state.workspace = true
splat-git.workspace = true
splat-i18n.workspace = true
splat-import.workspace = true
splat-markdown.workspace = true
splat-notes.workspace = true
splat-preview.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
libc.workspace = true
objc2 = { workspace = true, features = ["catch-all"] }
objc2-app-kit = { workspace = true, features = ["objc2-uniform-type-identifiers"] }
objc2-core-graphics = { workspace = true, optional = true, features = ["CGEvent", "CGEventTypes", "CGRemoteOperation", "libc"] }
objc2-foundation.workspace = true
objc2-uniform-type-identifiers.workspace = true
objc2-web-kit.workspace = true
krilla.workspace = true
krilla-svg.workspace = true
usvg.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
splat-ooxml.workspace = true
splat-testkit = { workspace = true, features = ["sources"] }

[features]
selftest = ["splat-editor-state/selftest", "splat-markdown/selftest", "dep:objc2-core-graphics"]

# What ships does what the tests saw: an overflow ends in `contained` instead of a wrong offset. A keystroke costs the same;
# measured on a full layout of 10 MB, about a fifth more.
# As the release, with what a debug build checks on top.
[profile.checked]
inherits = "release"
debug-assertions = true

[profile.release]
lto = "thin"
overflow-checks = true

# Parsing and layout otherwise change by a fifth with how the compiler happens to split these crates, which an unrelated new
# module can move; measured 228 and 146 ms against up to 295 and 155 ms at 10 MB.
[profile.release.package.splat-markdown]
codegen-units = 1

[profile.release.package.splat-preview]
codegen-units = 1

[profile.release.package.comrak]
codegen-units = 1
