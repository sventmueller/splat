name: Windows Release

on:
  push:
    branches: [main, windows-port, windows-feature-parity]
    tags: ["windows-v*"]
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the repository-pinned Rust toolchain and Windows target
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern 'channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt
          rustup target add --toolchain $channel x86_64-pc-windows-msvc
          rustup show active-toolchain

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Stage bundled offline preview engines
        shell: pwsh
        run: ./windows/prepare-preview.ps1

      - name: Validate Windows frontend JavaScript
        shell: pwsh
        run: |
          node --check windows/ui/app.js
          node --check windows/ui/preview/runtime.js
          node --check windows/ui/preview/js/render.js

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: windows/src-tauri -> target

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.2

      - name: Verify Tauri CLI
        run: tauri --version

      - name: Generate Windows application icons
        working-directory: windows/src-tauri
        run: tauri icon icons/icon.png

      - name: Check formatting and run Windows-core tests
        working-directory: windows/src-tauri
        run: |
          cargo fmt --check
          cargo test

      - name: Build NSIS installer
        working-directory: windows/src-tauri
        run: tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Splat-Windows-x64
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/windows-v') || github.ref == 'refs/heads/windows-port' || github.ref == 'refs/heads/windows-feature-parity'
    needs: build-windows-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download built installer
        uses: actions/download-artifact@v4
        with:
          name: Splat-Windows-x64
          path: release-assets

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path "release-assets" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          if ($env:GITHUB_REF -eq "refs/heads/windows-port" -or $env:GITHUB_REF -eq "refs/heads/windows-feature-parity") {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $tag = "windows-preview-$shortSha"
            gh release create $tag $installer.FullName `
              --title "Splat for Windows preview ($shortSha)" `
              --notes-file release-assets/RELEASE_NOTES.md `
              --target $env:GITHUB_SHA `
              --repo $env:GITHUB_REPOSITORY `
              --prerelease
          } else {
            gh release create $env:GITHUB_REF_NAME $installer.FullName `
              --title "Splat for Windows $($env:GITHUB_REF_NAME -replace '^windows-v', '')" `
              --notes-file release-assets/RELEASE_NOTES.md `
              --verify-tag `
              --prerelease
          }
